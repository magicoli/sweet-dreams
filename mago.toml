#:schema https://mago.carthage.software/1.49.0/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/1.49.0/en/tools/overview/
version = "1"
php-version = "8.4.0"

[source]
workspace = "."
# The whole project minus the excludes below: the same set Pint works on. It skips vendor/ at any
# depth, node_modules, storage, bootstrap/cache, build/ and Blade templates.
paths = ["."]
# Dependencies: parsed so the analyzer can resolve their classes and types, but never linted,
# analyzed or rewritten.
includes = ["vendor"]
excludes = [
    "etc",
    "node_modules",
    "storage",
    "tmp", # git-ignored scratch space
    "**/build",
    "**/cache",
    "**/*.blade.php",
    "**/vendor", # published copies of package files: lang/vendor, resources/views/vendor, public/vendor
    "**/.venv/**",
    "**/venv/**",
]

[source.glob]
literal-separator = true

[formatter]
preset = "pint"
# print-width = 120
space-around-concatenation-binary-operator = true
space-after-logical-not-unary-prefix-operator = true
# space-within-grouping-parenthesis = true
omit-redundant-arithmetic-binary-expression-parentheses = true
omit-redundant-bitwise-binary-expression-parentheses = true

[linter]
integrations = ["laravel", "phpunit", "pest"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
halstead = { effort-threshold = 7000 }

[analyzer]
plugins = []
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
memoize-properties = true
check-throws = true
unchecked-exceptions = ["Error", "LogicException"]
unchecked-exception-classes = []
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = true
allow-array-truthy-operand = false
no-boolean-literal-comparison = true
check-missing-type-hints = true
register-super-globals = true
